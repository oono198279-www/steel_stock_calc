<!DOCTYPE html>
<html lang="ja">
<head>
  <link rel="manifest" href="steel-calc.webmanifest">

  <!-- iOS ホーム画面用アイコン -->
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">

  <meta charset="UTF-8">
  <title>鋼材在庫 → 加工可能個数 計算</title>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">

  <style>
    :root{
      --bg:#050608;
      --card:#181b20;
      --card-soft:#22262e;
      --accent:#08c29e;
      --accent-soft:#0f9e84;
      --warn:#f5a623;
      --text-main:#f5f7fb;
      --text-sub:#a6acb8;
      --input-bg:#f5f5f5;
      --input-border:#c4c8d0;
      --input-text:#20232a;
      --border-soft:#303544;
      --btn-gray:#3a3f4a;
    }
    *{box-sizing:border-box;}
    html,body{
      margin:0;
      padding:0;
      background:radial-gradient(circle at top,#252a36 0,#050608 55%);
      color:var(--text-main);
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      -webkit-text-size-adjust:100%;
    }
    body{
      padding:12px 10px 40px;
    }
    h1{
      font-size:1.2rem;
      margin:8px 0 4px;
    }
    p{margin:0;}

    .wrapper{
      max-width:600px;
      margin:0 auto;
    }

    .card{
      background:rgba(10,12,18,.92);
      border-radius:14px;
      border:1px solid rgba(255,255,255,.06);
      box-shadow:0 18px 40px rgba(0,0,0,.6);
      padding:14px 14px 16px;
      margin-top:10px;
    }

    .card-header{
      margin-bottom:8px;
    }

    .card-header ul{
      margin:4px 0 0;
      padding-left:20px;
      color:var(--text-sub);
      font-size:.85rem;
    }

    .toolbar-row{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      margin-bottom:8px;
    }

    .btn{
      border:none;
      border-radius:10px;
      padding:6px 10px;
      font-size:.9rem;
      line-height:1.3;
      cursor:pointer;
      color:#fff;
      background:var(--btn-gray);
      box-shadow:0 2px 4px rgba(0,0,0,.4);
      white-space:nowrap;
    }
    .btn:active{
      transform:translateY(1px);
      box-shadow:0 1px 2px rgba(0,0,0,.5);
    }
    .btn-primary{
      background:var(--accent);
    }
    .btn-primary:hover{
      background:var(--accent-soft);
    }
    .btn-warn{
      background:var(--warn);
      color:#111;
    }
    .btn-ghost{
      background:transparent;
      border:1px solid rgba(255,255,255,.14);
      color:var(--text-main);
    }
    .btn-wide{
      width:100%;
      justify-content:center;
      text-align:center;
      display:inline-flex;
      align-items:center;
      justify-content:center;
    }

    /* メインの情報行 */
    .info-card{
      background:var(--card-soft);
      border-radius:12px;
      border:1px solid var(--border-soft);
      padding:10px 10px 12px;
      margin-top:6px;
    }
    .info-title{
      font-size:1.1rem;
      font-weight:600;
      margin-bottom:2px;
    }
    .info-sub{
      font-size:.9rem;
      color:var(--text-sub);
      margin-bottom:8px;
    }

    .form-row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:8px;
      padding:4px 0;
      border-top:1px solid rgba(255,255,255,.04);
      font-size:.9rem;
    }
    .form-row:first-of-type{
      border-top:none;
    }
    .form-label{
      flex:0 0 56%;
      color:var(--text-sub);
    }
    .form-value{
      flex:1;
      text-align:right;
    }
    .form-value span.num{
      font-variant-numeric:tabular-nums;
    }

    .input-main{
      width:100%;
      padding:4px 7px;
      border-radius:8px;
      border:1px solid var(--input-border);
      background:var(--input-bg);
      color:var(--input-text);
      font-size:1rem;           /* 16px 相当：ズーム防止 */
      font-variant-numeric:tabular-nums;
    }
    .input-main:focus{
      outline:none;
      border-color:var(--accent);
      box-shadow:0 0 0 2px rgba(8,194,158,.25);
    }

    select.input-main{
      padding-right:20px;
    }

    .readonly{
      color:var(--text-main);
    }

    .readonly .form-label{
      color:var(--text-sub);
    }

    .readonly .form-value{
      font-weight:600;
    }

    /* モーダル */
    .modal-backdrop{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.55);
      z-index:20;
      opacity:0;
      pointer-events:none;
      transition:opacity .15s ease-out;
    }
    .modal{
      position:fixed;
      inset:0;
      display:flex;
      align-items:flex-start;
      justify-content:center;
      padding:18px 8px 24px;
      z-index:30;
      pointer-events:none;
      opacity:0;
      transition:opacity .15s ease-out;
    }
    .modal.show,
    .modal-backdrop.show{
      opacity:1;
      pointer-events:auto;
    }
    .modal-content{
      width:100%;
      max-width:640px;
      max-height:100%;
      overflow:auto;
      background:var(--card);
      border-radius:14px;
      border:1px solid rgba(255,255,255,.1);
      padding:12px 12px 14px;
      box-shadow:0 20px 45px rgba(0,0,0,.7);
    }
    .modal-title{
      font-size:1rem;
      font-weight:600;
      margin-bottom:6px;
    }
    .modal-desc{
      font-size:.82rem;
      color:var(--text-sub);
      margin-bottom:8px;
    }

    .product-block{
      border-radius:10px;
      border:1px solid var(--border-soft);
      padding:8px;
      margin-top:8px;
      background:#151821;
    }
    .product-header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:4px;
    }
    .product-name{
      font-weight:600;
      font-size:.95rem;
    }

    .grid-2{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:4px 8px;
      margin-top:4px;
    }
    .field-label{
      font-size:.78rem;
      color:var(--text-sub);
      margin-bottom:1px;
    }
    .field-group{
      margin-bottom:4px;
    }
    .field-group.full{
      grid-column:1 / span 2;
    }

    .modal-footer{
      margin-top:10px;
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      justify-content:flex-end;
    }

    .btn-close{
      background:var(--btn-gray);
      color:#fff;
      font-weight:600;
      min-width:80px;
    }

    .btn-delete{
      margin-top:6px;
      border-radius:8px;
      padding:4px 8px;
      font-size:.8rem;
      border:none;
      background:var(--warn);
      color:#111;
      cursor:pointer;
    }
    .btn-delete:active{
      transform:translateY(1px);
    }

    @media (max-width:480px){
      .form-label{flex-basis:58%;}
      .grid-2{grid-template-columns:1fr 1fr;}
    }
  </style>
</head>
<body>
<div class="wrapper">

  <!-- 説明カード -->
  <div class="card">
    <div class="card-header">
      <h1>鋼材在庫 → 加工可能個数 計算</h1>
      <ul>
        <li>通常画面では鋼材束重量と鋼材本数だけ入力します。</li>
        <li>品番・製品全長・SC長さなどは「設定」から編集します。</li>
        <li>1本あたりの生産数・鋼材本数合計・加工可能個数は自動計算されます。</li>
      </ul>
    </div>
  </div>

  <!-- メインカード -->
  <div class="card" id="mainCard">
    <div class="toolbar-row">
      <button class="btn btn-ghost" id="btnExportJson">設定をJSONで保存</button>
      <button class="btn btn-ghost" id="btnImportJson">JSONから復元</button>
    </div>

    <button class="btn btn-primary btn-wide" id="btnOpenSettings">設定</button>

    <div class="info-card" id="currentInfo">
      <div class="info-title" id="currentCode">---</div>
      <div class="info-sub" id="currentName">---</div>

      <div class="form-row">
        <div class="form-label">表示中の品番</div>
        <div class="form-value">
          <select id="selectProduct" class="input-main"></select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-label">鋼材束重量（kg）</div>
        <div class="form-value">
          <input id="inputBundleWeight" type="text" inputmode="decimal"
                 class="input-main" autocomplete="off">
        </div>
      </div>

      <div class="form-row">
        <div class="form-label">鋼材本数（本）</div>
        <div class="form-value">
          <input id="inputBundleBars" type="text" inputmode="numeric"
                 class="input-main" autocomplete="off">
        </div>
      </div>

      <div class="form-row readonly">
        <div class="form-label">鋼材1本あたりの生産数</div>
        <div class="form-value">
          <span id="spanPcsPerBar" class="num">0</span> 個/本
        </div>
      </div>

      <div class="form-row readonly">
        <div class="form-label">鋼材本数合計</div>
        <div class="form-value">
          <span id="spanTotalBars" class="num">0</span> 本
        </div>
      </div>

      <div class="form-row readonly">
        <div class="form-label">加工可能個数</div>
        <div class="form-value">
          <span id="spanTotalPcs" class="num">0</span> 個
        </div>
      </div>
    </div>
  </div>

</div>

<!-- モーダルの背景 -->
<div class="modal-backdrop" id="modalBackdrop"></div>

<!-- 設定モーダル -->
<div class="modal" id="settingsModal">
  <div class="modal-content">
    <div class="modal-title">設定</div>
    <div class="modal-desc">
      品番ごとの寸法・条件を編集します。<br>
      ※鋼材束重量・鋼材本数（本）は通常画面からも編集できます。
    </div>

    <div id="productsContainer"></div>

    <div class="modal-footer">
      <button class="btn btn-primary" id="btnAddProduct">＋ 品番を追加</button>
      <button class="btn btn-warn" id="btnResetAll">全消去（初期値に戻す）</button>
      <button class="btn btn-close" id="btnCloseSettings">閉じる</button>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  const STORAGE_KEY = "steel_calc_v2";

  // 初期値
  const DEFAULT_PRODUCTS = [
    {
      code: "12-3456",
      name: "プラグ",
      steelUnitWeightKgPerM: 3.56,   // 鋼材単重（kg/m）
      barLengthMm: 3000,             // 鋼材長さ（mm）
      scrapLengthMm: 0,              // 端材長さ（mm）
      shortCutLengthMm: 0,           // ｼｮｰﾄｶｯﾄ長さ（mm）
      partLengthMm: 21,              // 製品全長（mm）
      cutoffThicknessMm: 2,          // 突切厚み（mm）
      allowFrontMm: 0.1,             // メイン側端面取代（mm）
      allowBackMm: 0.1,              // バック側端面取代（mm）
      bundleWeightKg: 277,           // 鋼材束重量（kg）
      bundleBarCountFactor: 5        // 鋼材本数（本）
    }
  ];

  let products = loadProducts();
  let currentIndex = 0;

  const fmtInt = (v)=>{
    if(!Number.isFinite(v)) return "0";
    return Math.round(v).toLocaleString("ja-JP");
  };

  // 計算ロジック
  function calc(p){
    const barLength   = +p.barLengthMm || 0;
    const scrap       = +p.scrapLengthMm || 0;
    const shortCut    = +p.shortCutLengthMm || 0;
    const allowF      = +p.allowFrontMm || 0;
    const allowB      = +p.allowBackMm || 0;
    const unitW       = +p.steelUnitWeightKgPerM || 0;   // kg/m
    const partL       = +p.partLengthMm || 0;
    const cutT        = +p.cutoffThicknessMm || 0;
    const bundleW     = +p.bundleWeightKg || 0;          // kg
    const bundleBars  = +p.bundleBarCountFactor || 0;    // 本

    // 鋼材1本あたりの生産数
    const usableLen = Math.max(0, barLength - scrap - shortCut);
    const pitchLen  = partL + cutT + allowF + allowB;
    const pcsPerBar = pitchLen > 0 ? Math.floor(usableLen / pitchLen) : 0;

    // 鋼材本数合計 = QUOTIENT(束重量, 単重) + 鋼材本数
    const barsFromWeight = unitW > 0 ? Math.floor(bundleW / unitW) : 0;
    const totalBars      = barsFromWeight + bundleBars;

    // 加工可能個数
    const totalPcs = pcsPerBar * totalBars;

    return { pcsPerBar, totalBars, totalPcs };
  }

  // localStorage 読み込み
  function loadProducts(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw){
        const obj = JSON.parse(raw);
        if(Array.isArray(obj.products) && obj.products.length){
          return obj.products;
        }
      }
    }catch(e){
      console.warn("loadProducts error", e);
    }
    return DEFAULT_PRODUCTS.map(p=>({...p}));
  }

  function saveProducts(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify({products}));
    }catch(e){
      console.warn("saveProducts error", e);
    }
  }

  // メイン画面の描画
  function renderMain(){
    if(products.length === 0){
      products = DEFAULT_PRODUCTS.map(p=>({...p}));
      currentIndex = 0;
    }
    if(currentIndex >= products.length) currentIndex = products.length-1;
    if(currentIndex < 0) currentIndex = 0;

    const p = products[currentIndex];
    const r = calc(p);

    document.getElementById("currentCode").textContent = p.code || "未設定";
    document.getElementById("currentName").textContent = p.name || "製品名 未設定";

    const sel = document.getElementById("selectProduct");
    sel.innerHTML = "";
    products.forEach((prod,idx)=>{
      const opt = document.createElement("option");
      opt.value = idx;
      opt.textContent = prod.code || `品番${idx+1}`;
      sel.appendChild(opt);
    });
    sel.value = String(currentIndex);

    document.getElementById("inputBundleWeight").value =
      p.bundleWeightKg == null ? "" : String(p.bundleWeightKg);
    document.getElementById("inputBundleBars").value =
      p.bundleBarCountFactor == null ? "" : String(p.bundleBarCountFactor);

    document.getElementById("spanPcsPerBar").textContent = fmtInt(r.pcsPerBar);
    document.getElementById("spanTotalBars").textContent = fmtInt(r.totalBars);
    document.getElementById("spanTotalPcs").textContent = fmtInt(r.totalPcs);
  }

  // 設定モーダル描画
  function renderSettings(){
    const container = document.getElementById("productsContainer");
    container.innerHTML = "";

    products.forEach((p,idx)=>{
      const block = document.createElement("div");
      block.className = "product-block";
      block.dataset.index = idx;

      const header = document.createElement("div");
      header.className = "product-header";
      const title = document.createElement("div");
      title.className = "product-name";
      title.textContent = p.code || `品番${idx+1}`;
      header.appendChild(title);
      block.appendChild(header);

      const grid = document.createElement("div");
      grid.className = "grid-2";

      const addField = (label,key,full=false)=>{
        const wrap = document.createElement("div");
        wrap.className = "field-group" + (full?" full":"");
        const lb = document.createElement("div");
        lb.className = "field-label";
        lb.textContent = label;
        const input = document.createElement("input");
        input.className = "input-main";
        input.dataset.key = key;
        input.dataset.index = idx;
        input.value = p[key] ?? "";
        if(/KgPerM|LengthMm|Mm$|WeightKg|Factor/.test(key)){
          input.type = "number";
          input.inputMode = "decimal";
        }else{
          input.type = "text";
        }
        input.addEventListener("input", onSettingsInput);
        wrap.appendChild(lb);
        wrap.appendChild(input);
        grid.appendChild(wrap);
      };

      addField("品番","code",true);
      addField("製品名","name",true);
      addField("鋼材単重（kg/m）","steelUnitWeightKgPerM");
      addField("鋼材長さ（mm）","barLengthMm");
      addField("端材長さ（mm）","scrapLengthMm");
      addField("ｼｮｰﾄｶｯﾄ長さ（mm）","shortCutLengthMm");
      addField("製品全長（mm）","partLengthMm");
      addField("突切厚み（mm）","cutoffThicknessMm");
      addField("メイン側端面取代（mm）","allowFrontMm");
      addField("バック側端面取代（mm）","allowBackMm");
      addField("鋼材束重量（kg）","bundleWeightKg");
      addField("鋼材本数（本）","bundleBarCountFactor");

      block.appendChild(grid);

      const delBtn = document.createElement("button");
      delBtn.className = "btn-delete";
      delBtn.textContent = "この品番を削除";
      delBtn.addEventListener("click", ()=>deleteProduct(idx));
      block.appendChild(delBtn);

      container.appendChild(block);
    });
  }

  function onSettingsInput(ev){
    const input = ev.currentTarget;
    const idx = +input.dataset.index;
    const key = input.dataset.key;
    let value = input.value;

    if (input.type === "number" && value !== "") {
      value = +value;
    }

    products[idx][key] = value;
    saveProducts();
    renderMain();

    if (key === "code") {
      const block = input.closest(".product-block");
      if (block) {
        const title = block.querySelector(".product-name");
        if (title) {
          title.textContent = value || `品番${idx + 1}`;
        }
      }
    }
  }

  function deleteProduct(idx){
    if(!confirm("この品番を削除しますか？")) return;
    products.splice(idx,1);
    if(products.length===0){
      products = DEFAULT_PRODUCTS.map(p=>({...p}));
    }
    if(currentIndex>=products.length) currentIndex = products.length-1;
    saveProducts();
    renderMain();
    renderSettings();
  }

  // JSON エクスポート
  function exportJson(){
    const data = {
      exportedAt: new Date().toISOString(),
      products
    };
    const blob = new Blob([JSON.stringify(data,null,2)], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "鋼材計算_backup.json";
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  // JSON インポート
  function importJson(){
    const input = document.createElement("input");
    input.type = "file";
    input.accept = "application/json,.json";
    input.addEventListener("change",()=>{
      const file = input.files && input.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = ()=>{
        try{
          const obj = JSON.parse(reader.result);
          if(Array.isArray(obj.products)){
            products = obj.products;
          }else if(Array.isArray(obj)){
            products = obj;
          }else{
            alert("JSONの形式が違うようです。");
            return;
          }
          currentIndex = 0;
          saveProducts();
          renderMain();
          renderSettings();
        }catch(e){
          console.error(e);
          alert("JSONの読み込みに失敗しました。");
        }
      };
      reader.readAsText(file,"utf-8");
    });
    input.click();
  }

  function openSettings(){
    document.getElementById("settingsModal").classList.add("show");
    document.getElementById("modalBackdrop").classList.add("show");
    renderSettings();
  }
  function closeSettings(){
    document.getElementById("settingsModal").classList.remove("show");
    document.getElementById("modalBackdrop").classList.remove("show");
  }

  function resetAll(){
    if(!confirm("全ての設定を初期値に戻しますか？")) return;
    products = DEFAULT_PRODUCTS.map(p=>({...p}));
    currentIndex = 0;
    saveProducts();
    renderMain();
    renderSettings();
  }

  // イベント設定
  document.getElementById("btnExportJson").addEventListener("click", exportJson);
  document.getElementById("btnImportJson").addEventListener("click", importJson);
  document.getElementById("btnOpenSettings").addEventListener("click", openSettings);
  document.getElementById("btnCloseSettings").addEventListener("click", closeSettings);
  document.getElementById("modalBackdrop").addEventListener("click", closeSettings);
  document.getElementById("btnAddProduct").addEventListener("click", ()=>{
    products.push({
      code:"",
      name:"",
      steelUnitWeightKgPerM:0,
      barLengthMm:0,
      scrapLengthMm:0,
      shortCutLengthMm:0,
      partLengthMm:0,
      cutoffThicknessMm:0,
      allowFrontMm:0,
      allowBackMm:0,
      bundleWeightKg:0,
      bundleBarCountFactor:0
    });
    currentIndex = products.length-1;
    saveProducts();
    renderMain();
    renderSettings();
  });
  document.getElementById("btnResetAll").addEventListener("click", resetAll);

  document.getElementById("selectProduct").addEventListener("change",(ev)=>{
    currentIndex = +ev.target.value || 0;
    renderMain();
  });

  // 計算結果だけ更新
  function updateMainOutputs(){
    const p = products[currentIndex];
    const r = calc(p);
    document.getElementById("spanPcsPerBar").textContent = fmtInt(r.pcsPerBar);
    document.getElementById("spanTotalBars").textContent = fmtInt(r.totalBars);
    document.getElementById("spanTotalPcs").textContent = fmtInt(r.totalPcs);
  }

  const inputBundleWeightEl = document.getElementById("inputBundleWeight");
  const inputBundleBarsEl   = document.getElementById("inputBundleBars");

  inputBundleWeightEl.addEventListener("input",(ev)=>{
    const v = ev.currentTarget.value;
    products[currentIndex].bundleWeightKg = v;   // 文字列のまま保存
    saveProducts();
    updateMainOutputs();
  });

  inputBundleBarsEl.addEventListener("input",(ev)=>{
    const v = ev.currentTarget.value;
    products[currentIndex].bundleBarCountFactor = v;
    saveProducts();
    updateMainOutputs();
  });

  // 初期描画
  renderMain();

})();
</script>
</body>
</html>
