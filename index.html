<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>鋼材在庫 → 加工可能個数 計算</title>

<style>
:root{
  --bg:#0b0c10;
  --panel:#111318;
  --ink:#e8eaed;
  --muted:#9aa0a6;
  --accent:#6ee7b7;
  --warn:#fbbf24;
  --grid:#22262e;
}
html,body{height:100%}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:-apple-system,system-ui,"Segoe UI",Roboto,
    "Hiragino Sans",Meiryo,Arial,sans-serif;
  display:flex;
  flex-direction:column;
  min-height:100vh;
}
.wrap{max-width:1200px;margin-inline:auto;padding:20px}

/* ヘッダ（タイトルだけ） */
header{
  position:sticky;
  top:0;
  background:linear-gradient(0deg,rgba(11,12,16,.0),rgba(11,12,16,.9));
  backdrop-filter:blur(6px);
  z-index:10;
}
h1{
  margin:10px 0 4px;
  font-size:clamp(20px,2.4vw,26px);
}

/* レイアウト */
.grid{
  display:grid;
  gap:16px;
  grid-template-columns:1fr;
  flex:1;
}
@media (min-width:980px){
  .grid{grid-template-columns:340px 1fr}
}
.card{
  background:var(--panel);
  border:1px solid var(--grid);
  border-radius:16px;
  padding:16px;
}
.card h2{margin:0 0 10px;font-size:18px}
.small{color:var(--muted);font-size:12px}

/* 表まわり */
.inputs{overflow:auto;position:relative;padding-bottom:40px}
.inputs::after{
  content:"";
  position:sticky;
  left:0;top:0;bottom:0;
  width:14px;
  background:var(--panel);
  z-index:4;
  pointer-events:none;
  display:block;
}
table{
  border-collapse:separate;
  border-spacing:0;
  width:max-content;
  min-width:100%;
  table-layout:fixed;
}
thead th{position:sticky;top:0;background:var(--panel);z-index:3}
th,td{
  border-bottom:1px solid var(--grid);
  padding:8px;
  text-align:left;
  vertical-align:middle;
}
tr:nth-child(even) td{background:rgba(255,255,255,0.02)}

/* 行見出し列 */
th.rowhead{
  width:120px;min-width:120px;max-width:120px;
  font-size:13px;line-height:1.3;
  white-space:normal;word-break:keep-all;overflow-wrap:anywhere;
}
@media (max-width:780px){
  th.rowhead{
    width:32vw;min-width:32vw;max-width:32vw;
    font-size:12px;line-height:1.25;
  }
}
thead th:not(.rowhead),tbody td{min-width:220px}

/* 入力 */
input[type="text"],input[type="number"]{
  width:100%;
  box-sizing:border-box;
  padding:6px 8px;
  border-radius:10px;
  border:1px solid var(--grid);
  background:#0e1116;
  color:var(--ink);
  font-size:15px;
}
input[type="number"]::-webkit-outer-spin-button,
input[type="number"]::-webkit-inner-spin-button{
  -webkit-appearance:none;margin:0;
}

/* 数値表示 */
.out{
  font-variant-numeric:tabular-nums;
  display:flex;
  gap:6px;
  align-items:baseline;
}
.out .num{
  font-size:18px;
  font-weight:700;
  letter-spacing:.02em;
}
.out .unit{
  font-size:12px;
  color:var(--muted);
}

/* ボタン */
.btn{
  cursor:pointer;
  appearance:none;
  border:1px solid var(--grid);
  background:#0e1116;
  color:#e8eaed;
  padding:6px 11px;
  border-radius:10px;
  font-size:14px;
}
.btn:hover{border-color:#394049}
.btn.primary{
  border-color:transparent;
  background:linear-gradient(135deg,#10b981,#22d3ee);
  color:#072619;
  font-weight:700;
}
.btn.warn{
  border-color:transparent;
  background:linear-gradient(135deg,#f59e0b,#fbbf24);
  color:#4a2d00;
  font-weight:700;
}
.toolbar{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  align-items:center;
}
.top-controls{margin-bottom:8px}

/* 設定モーダル */
.modal{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:100;
}
.modal.hidden{display:none}
.modal-backdrop{
  position:absolute;
  inset:0;
  background:rgba(0,0,0,0.55);
}
.modal-body{
  position:relative;
  max-height:90vh;
  overflow:auto;
  background:#111318;
  border-radius:16px;
  padding:16px;
  width:min(1000px,96vw);
  box-shadow:0 18px 40px rgba(0,0,0,.6);
}
.modal-body h2{margin:0 0 8px;font-size:18px}
.settings-container{margin-top:8px;margin-bottom:12px}
.settings-block{
  border:1px solid var(--grid);
  border-radius:12px;
  padding:10px 10px 12px;
  margin-bottom:10px;
}
.settings-block h3{
  margin:0 0 6px;
  font-size:15px;
}
.settings-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:8px;
}
.settings-field{
  display:flex;
  flex-direction:column;
  font-size:13px;
}
.settings-field span.label{
  margin-bottom:2px;
  color:var(--muted);
}
.settings-block .btn-small{
  margin-top:8px;
  font-size:13px;
  padding:6px 10px;
}
</style>

<!-- PWA 関連 -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b0c10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="鋼材計算">
<link rel="apple-touch-icon" href="icons/icon-192.png">
</head>
<body>
<header>
  <div class="wrap">
    <h1>鋼材在庫 → 加工可能個数 計算</h1>
  </div>
</header>

<div class="wrap grid">
  <section class="card">
    <h2>簡単な説明</h2>
    <ol class="small">
      <li>通常画面では「鋼材束重量（kg）」と「鋼材本数（本）」だけ入力します。</li>
      <li>品番・製品全長・SC長さなどは「全品番の設定」から編集します。</li>
      <li>1本あたりの生産数・鋼材本数合計・加工可能個数は自動計算されます。</li>
    </ol>
  </section>

  <section class="card inputs">
    <div class="toolbar top-controls">
      <button class="btn" id="btnSaveJson">設定をJSONで保存</button>
      <button class="btn" id="btnLoadJson">JSONから復元</button>
      <button class="btn primary" id="btnOpenSettings">全品番の設定</button>
    </div>

    <table id="t">
      <thead>
        <tr>
          <!-- 左上は空欄にして「項目」を非表示にする -->
          <th class="rowhead"></th>
          <th>品番A</th>
          <th>品番B</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </section>
</div>

<!-- 設定モーダル -->
<div class="modal hidden" id="settingsModal">
  <div class="modal-backdrop"></div>
  <div class="modal-body">
    <h2>品番ごとの詳細設定</h2>
    <p class="small">
      ここで品番・製品名・鋼材単重・SC長さなどを編集します。
      「鋼材束重量（kg）」「鋼材本数（本）」は通常画面側からも変更できます。
    </p>
    <div class="settings-container" id="settingsContainer"></div>
    <div class="toolbar" style="margin-top:8px">
      <button class="btn primary" id="addCol">＋ 品番を追加</button>
      <button class="btn" id="saveNow">手動保存</button>
      <button class="btn warn" id="resetAllModal">全消去（初期値に戻す）</button>
      <button class="btn" id="closeSettings">閉じる</button>
    </div>
  </div>
</div>

<script>
/* ==== 初期データ ==== */
const initialProducts=[
 {"品番":"12-3456","製品名":"ﾌﾟﾗｸﾞ","鋼材束重量":277,"鋼材本数(本数)":5,"鋼材単重":3.09,"鋼材長さ(mm)":3000,"端材長さ(mm)":255,"ｼｮｰﾄｶｯﾄ長さ(mm)":20,"製品全長(mm)":21,"突切厚み(mm)":2,"メイン側端面取代":0.1,"バック側端面取代":0.1},
 {"品番":"09-8765","製品名":"ｼﾞｬｯｸ","鋼材束重量":244,"鋼材本数(本数)":9,"鋼材単重":3.09,"鋼材長さ(mm)":3000,"端材長さ(mm)":262.5,"ｼｮｰﾄｶｯﾄ長さ(mm)":20,"製品全長(mm)":22,"突切厚み(mm)":2,"メイン側端面取代":0.1,"バック側端面取代":0.1}
];

/* 通常画面に出す行（7行） */
const mainRows=[
 {type:"display", key:"品番", label:"品番"},
 {type:"display", key:"製品名", label:"製品名"},
 {type:"input",   key:"鋼材束重量",     label:"鋼材束重量（kg）",     step:"0.01"},
 {type:"input",   key:"鋼材本数(本数)", label:"鋼材本数（本）",       step:"1"},
 {type:"calc",    calcKey:"pcsPerBar",  label:"鋼材1本あたりの生産数", unit:"個/本"},
 {type:"calc",    calcKey:"totalBars",  label:"鋼材本数合計",         unit:"本"},
 {type:"calc",    calcKey:"totalPcs",   label:"加工可能個数",         unit:"個"}
];

/* 設定モーダルで編集する項目（13項目） */
const settingsRows=[
 {key:"品番",label:"品番",type:"text"},
 {key:"製品名",label:"製品名",type:"text"},
 {key:"鋼材単重",label:"鋼材単重",unit:"kg",step:"0.01",type:"number"},
 {key:"鋼材長さ(mm)",label:"鋼材長さ",unit:"mm",step:"0.1",type:"number"},
 {key:"端材長さ(mm)",label:"端材長さ",unit:"mm",step:"0.1",type:"number"},
 {key:"ｼｮｰﾄｶｯﾄ長さ(mm)",label:"ｼｮｰﾄｶｯﾄ長さ",unit:"mm",step:"0.1",type:"number"},
 {key:"製品全長(mm)",label:"製品全長",unit:"mm",step:"0.1",type:"number"},
 {key:"突切厚み(mm)",label:"突切厚み",unit:"mm",step:"0.1",type:"number"},
 {key:"メイン側端面取代",label:"メイン側端面取代",unit:"mm",step:"0.01",type:"number"},
 {key:"バック側端面取代",label:"バック側端面取代",unit:"mm",step:"0.01",type:"number"},
 {key:"鋼材束重量",label:"鋼材束重量",unit:"kg",step:"0.01",type:"number"},
 {key:"鋼材本数(本数)",label:"鋼材本数",unit:"本",step:"1",type:"number"},
 {key:"_dummy",label:"（削除ボタン用）",dummy:true}
];

const elTable=document.getElementById('t');
const elTbody=document.getElementById('tbody');

const btnSaveJson=document.getElementById('btnSaveJson');
const btnLoadJson=document.getElementById('btnLoadJson');
const btnOpenSettings=document.getElementById('btnOpenSettings');

const modal=document.getElementById('settingsModal');
const settingsContainer=document.getElementById('settingsContainer');
const btnCloseSettings=document.getElementById('closeSettings');
const btnAddCol=document.getElementById('addCol');
const btnSaveNow=document.getElementById('saveNow');
const btnResetModal=document.getElementById('resetAllModal');

/* localStorage key は固定 */
const STORE_KEY="steel-calc-v1";

function loadData(){
  try{
    const raw=localStorage.getItem(STORE_KEY);
    if(!raw) return structuredClone(initialProducts);
    const arr=JSON.parse(raw);
    if(!Array.isArray(arr)||arr.length===0) return structuredClone(initialProducts);
    return arr;
  }catch(e){
    console.warn('load failed',e);
    return structuredClone(initialProducts);
  }
}
function saveData(){
  try{
    localStorage.setItem(STORE_KEY, JSON.stringify(products));
  }catch(e){
    console.warn('save failed',e);
  }
}

/* 計算ロジック */
function calcValues(p){
  const n=v=>isFinite(+v)?+v:0;
  const L=n(p["鋼材長さ(mm)"]),
        off=n(p["端材長さ(mm)"]),
        sc=n(p["ｼｮｰﾄｶｯﾄ長さ(mm)"]);
  const part=n(p["製品全長(mm)"]),
        cut=n(p["突切厚み(mm)"]),
        fm=n(p["メイン側端面取代"]),
        fb=n(p["バック側端面取代"]);
  const feedPer=part+cut+fm+fb;
  const usable=L-off-sc;
  const pcsPerBar = feedPer>0 ? Math.floor(usable/feedPer) : 0;

  const bundleKg=n(p["鋼材束重量"]),
        unitKg=n(p["鋼材単重"]),
        countBars=n(p["鋼材本数(本数)"]);
  const barsFromKg = unitKg>0 ? Math.floor(bundleKg/unitKg) : 0;
  const totalBars = barsFromKg + countBars;
  const totalPcs  = pcsPerBar * totalBars;

  return {pcsPerBar,totalBars,totalPcs};
}
const fmtInt=n=>(isFinite(+n)?Math.floor(+n):0).toLocaleString();

/* テーブル全体の描画 */
function syncHeaderCols(){
  const theadRow=elTable.querySelector('thead tr');
  while(theadRow.children.length<products.length+1){
    const th=document.createElement('th');
    th.textContent=`品番${String.fromCharCode(65+(theadRow.children.length-1))}`;
    theadRow.appendChild(th);
  }
  while(theadRow.children.length>products.length+1){
    theadRow.removeChild(theadRow.lastElementChild);
  }
  // 見出し名を品番で上書き
  products.forEach((p,i)=>{
    const th=theadRow.children[i+1];
    if(th) th.textContent=p["品番"]||`品番${String.fromCharCode(65+i)}`;
  });
}

function render(){
  syncHeaderCols();
  elTbody.innerHTML='';

  mainRows.forEach(row=>{
    const tr=document.createElement('tr');
    const th=document.createElement('th');
    th.className='rowhead';
    th.textContent=row.label;
    tr.appendChild(th);

    products.forEach((p,colIdx)=>{
      const td=document.createElement('td');

      if(row.type==="display"){
        const span=document.createElement('span');
        span.textContent=(p[row.key]??"").toString();
        td.appendChild(span);

      }else if(row.type==="input"){
        const inp=document.createElement('input');
        inp.type='number';
        if(row.step) inp.step=row.step;
        inp.value=p[row.key] ?? '';
        inp.dataset.key=row.key;
        inp.dataset.col=colIdx;
        inp.addEventListener('input',ev=>{
          const key=ev.currentTarget.dataset.key;
          const i=+ev.currentTarget.dataset.col;
          const v=ev.currentTarget.value===''?'':+ev.currentTarget.value;
          products[i][key]=v;
          saveData();
          updateCalcCellsForCol(i);
        });
        td.appendChild(inp);

      }else if(row.type==="calc"){
        const r=calcValues(p);
        const val = row.calcKey==="pcsPerBar" ? r.pcsPerBar :
                    row.calcKey==="totalBars" ? r.totalBars :
                    r.totalPcs;
        const div=document.createElement('div');
        div.className='out';
        const num=document.createElement('span');
        num.className='num';
        num.dataset.calc=row.calcKey;
        num.dataset.col=colIdx;
        num.textContent=fmtInt(val);
        div.appendChild(num);
        if(row.unit){
          const u=document.createElement('span');
          u.className='unit';
          u.textContent=row.unit;
          div.appendChild(u);
        }
        td.appendChild(div);
      }

      tr.appendChild(td);
    });

    elTbody.appendChild(tr);
  });
}

/* 1列分の計算セルだけ更新 */
function updateCalcCellsForCol(i){
  const p=products[i];
  const r=calcValues(p);
  const map={
    pcsPerBar:r.pcsPerBar,
    totalBars:r.totalBars,
    totalPcs:r.totalPcs
  };
  Object.entries(map).forEach(([key,val])=>{
    const span=document.querySelector(`span[data-calc="${key}"][data-col="${i}"]`);
    if(span) span.textContent=fmtInt(val);
  });
}

/* 設定モーダル描画 */
function renderSettings(){
  settingsContainer.innerHTML='';
  products.forEach((p,i)=>{
    const block=document.createElement('div');
    block.className='settings-block';

    const h3=document.createElement('h3');
    h3.textContent=p["品番"]||`品番${String.fromCharCode(65+i)}`;
    block.appendChild(h3);

    const grid=document.createElement('div');
    grid.className='settings-grid';

    settingsRows.forEach(row=>{
      if(row.dummy) return;
      const field=document.createElement('label');
      field.className='settings-field';

      const lab=document.createElement('span');
      lab.className='label';
      lab.textContent=row.label+(row.unit?` (${row.unit})`:'');
      const inp=document.createElement('input');
      inp.type=row.type||'text';
      if(row.step) inp.step=row.step;
      inp.value=p[row.key] ?? '';
      inp.addEventListener('input',ev=>{
        const v = ev.currentTarget.type==='number'
          ? (ev.currentTarget.value===''?'':+ev.currentTarget.value)
          : ev.currentTarget.value;
        products[i][row.key]=v;
        saveData();
        // 品番・製品名・束重量・本数は通常画面にも反映
        if(row.key==="品番" || row.key==="製品名" ||
           row.key==="鋼材束重量" || row.key==="鋼材本数(本数)"){
          render();
        }else{
          updateCalcCellsForCol(i);
        }
      });

      field.appendChild(lab);
      field.appendChild(inp);
      grid.appendChild(field);
    });

    block.appendChild(grid);

    const delBtn=document.createElement('button');
    delBtn.className='btn btn-small warn';
    delBtn.textContent='この品番を削除';
    delBtn.onclick=()=>deleteProduct(i);
    block.appendChild(delBtn);

    settingsContainer.appendChild(block);
  });
}

/* 品番追加・削除・リセット */
function deleteProduct(i){
  if(products.length<=1){
    alert('少なくとも1列は必要です');
    return;
  }
  products.splice(i,1);
  saveData();
  render();
  if(!modal.classList.contains('hidden')) renderSettings();
}
function resetToInitial(){
  if(!confirm('ローカル保存を削除して初期値に戻します。よろしいですか？')) return;
  localStorage.removeItem(STORE_KEY);
  products=structuredClone(initialProducts);
  render();
  if(!modal.classList.contains('hidden')) renderSettings();
}

/* ==== 状態 ==== */
let products=loadData();
render();

/* ==== イベントいろいろ ==== */
btnOpenSettings.onclick=()=>{
  renderSettings();
  modal.classList.remove('hidden');
};
btnCloseSettings.onclick=()=>modal.classList.add('hidden');
modal.addEventListener('click',e=>{
  if(e.target.classList.contains('modal-backdrop')){
    modal.classList.add('hidden');
  }
});

btnAddCol.onclick=()=>{
  const blank={};
  settingsRows.forEach(r=>{
    if(r.dummy) return;
    blank[r.key]= (r.type==='number') ? 0 : '';
  });
  blank["品番"]=`NEW-${Math.random().toString(36).slice(2,6).toUpperCase()}`;
  products.push(blank);
  saveData();
  render();
  if(!modal.classList.contains('hidden')) renderSettings();
};
btnSaveNow.onclick=saveData;
btnResetModal.onclick=resetToInitial;

/* ==== JSON保存・復元 ==== */
const jsonFileInput=document.createElement('input');
jsonFileInput.type='file';
jsonFileInput.accept='application/json';
jsonFileInput.style.display='none';
document.body.appendChild(jsonFileInput);

btnSaveJson.onclick=()=>{
  const payload={
    version:"steel-calc-config-v1",
    savedAt:new Date().toISOString(),
    products
  };
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  const d=new Date();
  const pad=n=>String(n).padStart(2,'0');
  const fname=
    `鋼材計算_backup_${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}`+
    `_${pad(d.getHours())}${pad(d.getMinutes())}.json`;
  a.href=URL.createObjectURL(blob);
  a.download=fname;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(a.href);
};

btnLoadJson.onclick=()=>jsonFileInput.click();

jsonFileInput.addEventListener('change',async ev=>{
  const file=ev.target.files?.[0];
  if(!file) return;
  try{
    const text=await file.text();
    const data=JSON.parse(text);
    const arr=Array.isArray(data.products)?data.products:
              (Array.isArray(data)?data:null);
    if(!arr){
      alert('JSONの形式が想定と違います');
      return;
    }
    products=arr;
    saveData();
    render();
    if(!modal.classList.contains('hidden')) renderSettings();
    alert('JSONから設定を復元しました。');
  }catch(e){
    console.error(e);
    alert('JSONの読み込みに失敗しました。');
  }finally{
    jsonFileInput.value='';
  }
});

/* ==== PWA用 Service Worker 登録 ==== */
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('./sw.js').catch(console.error);
  });
}
</script>
</body>
</html>
